<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="trace-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#trace-grad1)"/>
  
  <!-- Supply chain / flux logistique -->
  <!-- Colis / Cartons isométriques -->
  <g transform="translate(100, 180)">
    <path d="M 0 40 L 40 20 L 80 40 L 40 60 Z" fill="#f59e0b" opacity="0.2"/>
    <path d="M 0 40 L 40 60 L 40 100 L 0 80 Z" fill="#f59e0b" opacity="0.15"/>
    <path d="M 40 60 L 80 40 L 80 80 L 40 100 Z" fill="#ea580c" opacity="0.2"/>
    <!-- Bande adhésive -->
    <rect x="15" y="52" width="50" height="4" fill="#f59e0b" opacity="0.4" transform="skewY(-20)"/>
  </g>
  
  <g transform="translate(250, 150)">
    <path d="M 0 40 L 35 22 L 70 40 L 35 58 Z" fill="#f59e0b" opacity="0.18"/>
    <path d="M 0 40 L 35 58 L 35 95 L 0 77 Z" fill="#f59e0b" opacity="0.13"/>
    <path d="M 35 58 L 70 40 L 70 77 L 35 95 Z" fill="#ea580c" opacity="0.18"/>
  </g>
  
  <g transform="translate(420, 190)">
    <path d="M 0 35 L 38 18 L 76 35 L 38 52 Z" fill="#f59e0b" opacity="0.2"/>
    <path d="M 0 35 L 38 52 L 38 90 L 0 73 Z" fill="#f59e0b" opacity="0.15"/>
    <path d="M 38 52 L 76 35 L 76 73 L 38 90 Z" fill="#ea580c" opacity="0.2"/>
    <!-- Bande -->
    <rect x="15" y="47" width="46" height="4" fill="#f59e0b" opacity="0.4" transform="skewY(-18)"/>
  </g>
  
  <!-- QR Codes stylisés -->
  <g transform="translate(600, 120)">
    <rect x="0" y="0" width="60" height="60" rx="3" fill="#ffffff" opacity="0.3"/>
    <!-- Pattern QR simplifié -->
    <rect x="5" y="5" width="10" height="10" fill="#f59e0b" opacity="0.6"/>
    <rect x="20" y="5" width="10" height="10" fill="#f59e0b" opacity="0.5"/>
    <rect x="35" y="5" width="10" height="10" fill="#f59e0b" opacity="0.6"/>
    <rect x="50" y="5" width="5" height="5" fill="#f59e0b" opacity="0.7"/>
    <rect x="5" y="20" width="10" height="10" fill="#f59e0b" opacity="0.5"/>
    <rect x="20" y="20" width="10" height="10" fill="#f59e0b" opacity="0.7"/>
    <rect x="35" y="20" width="10" height="10" fill="#f59e0b" opacity="0.4"/>
    <rect x="5" y="35" width="10" height="10" fill="#f59e0b" opacity="0.6"/>
    <rect x="20" y="35" width="10" height="10" fill="#f59e0b" opacity="0.5"/>
    <rect x="35" y="35" width="10" height="10" fill="#f59e0b" opacity="0.6"/>
    <rect x="50" y="50" width="5" height="5" fill="#f59e0b" opacity="0.7"/>
  </g>
  
  <!-- Chaîne / Liens de traçabilité -->
  <g opacity="0.3" stroke="#f59e0b" stroke-width="3" fill="none">
    <!-- Cercles connectés -->
    <circle cx="140" cy="220" r="12" fill="#f59e0b" opacity="0.4"/>
    <circle cx="285" cy="190" r="12" fill="#f59e0b" opacity="0.4"/>
    <circle cx="458" cy="225" r="12" fill="#f59e0b" opacity="0.4"/>
    <circle cx="630" cy="150" r="12" fill="#f59e0b" opacity="0.4"/>
    
    <!-- Lignes de connexion -->
    <path d="M 152 220 L 273 190" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <path d="M 297 190 L 446 225" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <path d="M 470 225 L 618 150" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Étiquettes / Tags -->
  <g transform="translate(120, 100)">
    <rect x="0" y="0" width="70" height="25" rx="12" fill="#f59e0b" opacity="0.2"/>
    <circle cx="15" cy="12" r="6" fill="#ffffff" opacity="0.4"/>
    <line x1="25" y1="12" x2="60" y2="12" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  </g>
  
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="70" height="25" rx="12" fill="#ea580c" opacity="0.2"/>
    <circle cx="15" cy="12" r="6" fill="#ffffff" opacity="0.4"/>
    <line x1="25" y1="12" x2="60" y2="12" stroke="#ea580c" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Check / Validation icons -->
  <g transform="translate(550, 260)">
    <circle cx="20" cy="20" r="18" fill="#f59e0b" opacity="0.15"/>
    <path d="M 12 20 L 18 26 L 30 14" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(680, 240)">
    <circle cx="18" cy="18" r="16" fill="#ea580c" opacity="0.15"/>
    <path d="M 11 18 L 16 23 L 26 13" stroke="#ea580c" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  
  <!-- Flux / flèches directionnelles -->
  <g opacity="0.25" stroke="#f59e0b" stroke-width="2" fill="#f59e0b">
    <path d="M 200 300 L 350 300" stroke-linecap="round"/>
    <polygon points="345,295 355,300 345,305"/>
    <path d="M 380 300 L 530 300" stroke-linecap="round"/>
    <polygon points="525,295 535,300 525,305"/>
  </g>
  
  <!-- Grille subtile -->
  <g opacity="0.06" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
</svg>
