<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="immo-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#immo-grad1)"/>
  
  <!-- Immeubles stylisés (isométriques) -->
  <!-- Immeuble 1 -->
  <g transform="translate(150, 120)">
    <path d="M 0 120 L 60 90 L 60 20 L 0 50 Z" fill="#3b82f6" opacity="0.15"/>
    <path d="M 60 90 L 120 120 L 120 50 L 60 20 Z" fill="#2563eb" opacity="0.2"/>
    <path d="M 0 50 L 60 20 L 120 50 L 60 80 Z" fill="#60a5fa" opacity="0.12"/>
    <!-- Fenêtres -->
    <rect x="10" y="65" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="10" y="85" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="10" y="105" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="35" y="65" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="35" y="85" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="35" y="105" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
  </g>
  
  <!-- Immeuble 2 (plus haut) -->
  <g transform="translate(320, 80)">
    <path d="M 0 140 L 70 110 L 70 10 L 0 40 Z" fill="#3b82f6" opacity="0.18"/>
    <path d="M 70 110 L 140 140 L 140 40 L 70 10 Z" fill="#2563eb" opacity="0.22"/>
    <path d="M 0 40 L 70 10 L 140 40 L 70 70 Z" fill="#60a5fa" opacity="0.15"/>
    <!-- Fenêtres -->
    <rect x="15" y="60" width="15" height="15" fill="#3b82f6" opacity="0.35"/>
    <rect x="15" y="85" width="15" height="15" fill="#3b82f6" opacity="0.35"/>
    <rect x="15" y="110" width="15" height="15" fill="#3b82f6" opacity="0.35"/>
    <rect x="45" y="60" width="15" height="15" fill="#3b82f6" opacity="0.35"/>
    <rect x="45" y="85" width="15" height="15" fill="#3b82f6" opacity="0.35"/>
    <rect x="45" y="110" width="15" height="15" fill="#3b82f6" opacity="0.35"/>
  </g>
  
  <!-- Immeuble 3 -->
  <g transform="translate(520, 140)">
    <path d="M 0 100 L 55 75 L 55 25 L 0 50 Z" fill="#3b82f6" opacity="0.16"/>
    <path d="M 55 75 L 110 100 L 110 50 L 55 25 Z" fill="#2563eb" opacity="0.19"/>
    <path d="M 0 50 L 55 25 L 110 50 L 55 75 Z" fill="#60a5fa" opacity="0.13"/>
    <!-- Fenêtres -->
    <rect x="12" y="65" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="12" y="85" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="32" y="65" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
    <rect x="32" y="85" width="12" height="12" fill="#3b82f6" opacity="0.3"/>
  </g>
  
  <!-- Documents / Dossiers stylisés -->
  <g transform="translate(580, 240)">
    <rect x="0" y="0" width="50" height="60" rx="3" fill="#3b82f6" opacity="0.2"/>
    <rect x="10" y="10" width="50" height="60" rx="3" fill="#2563eb" opacity="0.25"/>
    <rect x="20" y="20" width="50" height="60" rx="3" fill="#60a5fa" opacity="0.2"/>
    <!-- Lignes de texte -->
    <line x1="28" y1="35" x2="60" y2="35" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="28" y1="45" x2="60" y2="45" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
    <line x1="28" y1="55" x2="55" y2="55" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Calendrier stylisé -->
  <g transform="translate(100, 270)">
    <rect x="0" y="0" width="80" height="70" rx="4" fill="#3b82f6" opacity="0.15"/>
    <rect x="0" y="0" width="80" height="15" rx="4" fill="#2563eb" opacity="0.3"/>
    <!-- Cases calendrier -->
    <rect x="8" y="22" width="10" height="10" fill="#3b82f6" opacity="0.25"/>
    <rect x="23" y="22" width="10" height="10" fill="#3b82f6" opacity="0.25"/>
    <rect x="38" y="22" width="10" height="10" fill="#3b82f6" opacity="0.25"/>
    <rect x="53" y="22" width="10" height="10" fill="#3b82f6" opacity="0.25"/>
    <rect x="8" y="37" width="10" height="10" fill="#3b82f6" opacity="0.35"/>
    <rect x="23" y="37" width="10" height="10" fill="#3b82f6" opacity="0.25"/>
    <rect x="38" y="37" width="10" height="10" fill="#3b82f6" opacity="0.25"/>
  </g>
  
  <!-- Icônes symboliques (clés, contrats) -->
  <g transform="translate(680, 80)">
    <circle cx="20" cy="20" r="15" fill="none" stroke="#3b82f6" stroke-width="3" opacity="0.3"/>
    <rect x="18" y="20" width="4" height="25" fill="#3b82f6" opacity="0.3"/>
    <rect x="18" y="38" width="8" height="3" fill="#3b82f6" opacity="0.3"/>
    <rect x="18" y="43" width="6" height="2" fill="#3b82f6" opacity="0.3"/>
  </g>
  
  <!-- Grille subtile -->
  <g opacity="0.06" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
</svg>
