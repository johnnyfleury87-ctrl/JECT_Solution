<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="analyse-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.08" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="800" height="400" fill="url(#analyse-grad1)"/>

  <!-- Grille d'analyse -->
  <g opacity="0.15" stroke="#818cf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
  </g>

  <!-- Scénario A : barres -->
  <g transform="translate(120, 180)">
    <rect x="0" y="60" width="26" height="60" rx="3" fill="#a78bfa" opacity="0.35"/>
    <rect x="36" y="30" width="26" height="90" rx="3" fill="#818cf8" opacity="0.3"/>
    <rect x="72" y="0" width="26" height="120" rx="3" fill="#6366f1" opacity="0.35"/>
  </g>

  <!-- Scénario B : courbe comparative -->
  <g transform="translate(360, 140)">
    <path d="M0,140 C60,120 90,40 150,60 C200,75 230,20 280,10"
      fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <path d="M0,160 C60,150 90,110 150,120 C200,128 230,90 280,95"
      fill="none" stroke="#6366f1" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Loupe : analyse -->
  <g transform="translate(640, 90)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#818cf8" stroke-width="6" opacity="0.35"/>
    <line x1="50" y1="50" x2="75" y2="75" stroke="#818cf8" stroke-width="7" opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- Points de rupture / friction -->
  <g fill="#6366f1" opacity="0.4">
    <circle cx="180" cy="260" r="5"/>
    <circle cx="260" cy="290" r="5"/>
    <circle cx="340" cy="250" r="5"/>
  </g>
</svg>
